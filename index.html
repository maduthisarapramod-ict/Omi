<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="Pramod Maduthisara">
<meta name="theme-color" content="#0b3d24">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="darkreader-lock">
<title>OMI Royal – The Sri Lankan card game</title>
<link rel="manifest" href="manifest.json">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Lilita+One&family=Noto+Sans+Sinhala:wght@500;700&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--hw:clamp(50px,17vw,84px);--tw:clamp(46px,15vw,72px);--gold:#ffc83d;--felt:#14703b;--teamA:#4aa3ff;--teamB:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Fredoka,"Noto Sans Sinhala","Noto Sans Tamil","Trebuchet MS",sans-serif;font-weight:500;color:#fff;background:radial-gradient(#0f5c30,#06251a);overflow:hidden}
.scr{position:fixed;inset:0 auto 0 50%;width:min(100vw,640px);margin-left:calc(min(100vw,640px)/-2);display:none;flex-direction:column;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));overflow:auto;background:radial-gradient(ellipse at 50% 30%,#23a057,#0e5230 55%,#07281a);transition:left .25s cubic-bezier(.22,1,.36,1)}
.scr::before{content:"";position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(circle at 15% 20%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/46px 46px,
 radial-gradient(circle at 70% 60%,rgba(255,215,100,.07) 0 2px,transparent 3px) 0 0/58px 58px}
.scr>*{position:relative}
.scr.on{display:flex}
.lil{font-family:"Lilita One","Noto Sans Sinhala","Noto Sans Tamil","Arial Black",sans-serif;font-weight:400}
/* buttons */
.btn{font-family:"Lilita One","Noto Sans Sinhala","Noto Sans Tamil",sans-serif;font-size:24px;letter-spacing:.03em;color:#fff;border:0;border-radius:40px;padding:12px 38px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3);transition:transform .1s,filter .2s;max-width:100%}
.btn:active{transform:translateY(3px)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.ib:focus-visible,.sb:focus-visible,.sbtn:focus-visible,.qchip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.o{background:linear-gradient(#ffd23d,#ff8a00);box-shadow:0 6px 0 #a85200,0 0 30px rgba(255,170,0,.5);color:#6b3000;text-shadow:0 2px 0 #ffe9a0;font-size:34px;padding:10px 54px;animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 6px 0 #a85200,0 0 8px rgba(255,170,0,.3)}}
.g{background:linear-gradient(#6df05a,#2cb52c);box-shadow:0 5px 0 #1d7d1d}
.b{background:linear-gradient(#53b9ff,#1a74e0);box-shadow:0 5px 0 #0e4aa0}
.r{background:linear-gradient(#ff7a7a,#d62a3a);box-shadow:0 5px 0 #8c1220}
html[lang=si] .btn,html[lang=ta] .btn{font-size:20px;padding:12px 28px}
html[lang=si] .o,html[lang=ta] .o{font-size:28px}
.ib{width:40px;height:40px;border:0;border-radius:50%;font-size:18px;background:#fff7e0;box-shadow:0 3px 0 #b99a50;cursor:pointer;position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .1s,filter .15s}
.ib:active{transform:translateY(2px)}
.ib.muted{background:#ead8b0;opacity:.85}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ff3b4e;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.badge.on{display:flex}
.inp{font:inherit;font-size:20px;text-align:center;color:#2a1c00;background:#f6e7c4;border:0;border-radius:14px;padding:10px 14px;width:100%;max-width:300px;box-shadow:inset 0 3px 0 rgba(0,0,0,.15)}
.inp::placeholder{color:#7a6a45}
.panel{width:100%;max-width:520px;background:rgba(5,30,20,.74);border:2px solid rgba(255,200,80,.35);border-radius:22px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;backdrop-filter:blur(4px)}
.bar{width:100%;display:flex;align-items:center;gap:10px;background:linear-gradient(#a8692f,#6e3f18);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 #3e220b;font-size:22px}
.bar>span{flex:1}
.credit{margin-top:auto;font-size:13px;opacity:.8;text-align:center;padding-top:8px;padding-bottom:54px}
/* language switch */
.lang{display:flex;gap:4px;background:rgba(0,0,0,.35);padding:3px;border-radius:30px}
.lang button{font:inherit;font-size:14px;border:0;background:transparent;color:#fff;padding:5px 11px;border-radius:30px;cursor:pointer}
.lang button.on{background:var(--gold);color:#5a3200;font-weight:700}
#home>.lang{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:5}
/* logo */
.fan{position:relative;width:210px;height:150px;margin-top:34px;animation:fl 3.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.fan .card{position:absolute;left:50%;bottom:0;width:92px;margin-left:-46px;transform-origin:50% 120%;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.crown{position:absolute;left:50%;top:-34px;width:92px;margin-left:-46px;z-index:5;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.logo{position:relative;font-family:"Lilita One",sans-serif;font-size:min(30vw,150px);line-height:.9;margin-top:-30px;isolation:isolate;text-align:center;letter-spacing:.02em}
.logo span{display:block;background:linear-gradient(#fff6a0,#ffc400 45%,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:9px #3a1600;paint-order:stroke fill}
.logo::before{content:attr(data-t);position:absolute;inset:0;z-index:-1;color:#fff;-webkit-text-stroke:30px #fff;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.rib{position:relative;font-family:"Lilita One",sans-serif;font-size:26px;letter-spacing:.38em;padding:3px 34px 3px 42px;margin-top:-6px;color:#fff3b0;text-shadow:0 2px 0 #5a0a18;background:linear-gradient(#e8344b,#a3112a);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
/* cards */
.card{container-type:inline-size;position:relative;aspect-ratio:5/7;border-radius:7%;background:linear-gradient(145deg,#fff,#efefef);box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 .6cqw #cfcfcf;user-select:none;font-family:Fredoka,sans-serif}
.card.red{color:#d4202c}.card.blk{color:#16161a}
.ix{position:absolute;left:7cqw;top:5cqw;display:flex;flex-direction:column;align-items:center;line-height:.95;font-weight:700}
.ix b{font-size:25cqw}.ix i{font-style:normal;font-size:20cqw}
.ix.br{left:auto;right:7cqw;top:auto;bottom:5cqw;transform:rotate(180deg)}
.pip{position:absolute;transform:translate(-50%,-50%);font-size:23cqw;line-height:1}.pip.fl{transform:translate(-50%,-50%) rotate(180deg)}.pip.big{font-size:60cqw}
.face{position:absolute;left:25%;right:25%;top:12%;bottom:12%;border:1.6cqw solid #c99a2e;border-radius:4cqw;background:linear-gradient(135deg,#fff8dc,#f0cf74);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1cqw #fff4c2}
.face b{font-size:50cqw;font-weight:400;line-height:1;filter:drop-shadow(0 1cqw 0 rgba(0,0,0,.2))}
.fs{position:absolute;font-size:15cqw}.fs.t{top:2cqw;left:3cqw}.fs.b{bottom:2cqw;right:3cqw;transform:rotate(180deg)}
.cback{background:#fff;color:#7b1230}
.cback::before{content:"";position:absolute;inset:5%;border-radius:5%;background:repeating-linear-gradient(45deg,#7b1230 0 3cqw,#a01a40 3cqw 6cqw);box-shadow:inset 0 0 0 1.6cqw #f3c969}
.cback::after{content:"O";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40cqw;height:40cqw;border-radius:50%;background:radial-gradient(#ffe27a,#d99a12);font:400 28cqw/40cqw "Lilita One",sans-serif;text-align:center;box-shadow:0 0 0 1.4cqw #7b1230}
/* table & modern scoreboard */
#tbl{padding:0;gap:0;overflow:hidden}
#tbl::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38));pointer-events:none}
#ring{position:absolute;left:50%;top:47%;width:88%;height:46%;transform:translate(-50%,-50%);border:2px solid rgba(255,215,100,.28);border-radius:50%;box-shadow:inset 0 0 40px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font:400 min(24vw,120px) "Lilita One",sans-serif;color:rgba(255,215,100,.09)}
#hud{position:relative;z-index:8;width:100%;display:flex;align-items:center;gap:6px;padding:max(7px,env(safe-area-inset-top)) 8px 7px;background:linear-gradient(#9b5f29,#5e3310);box-shadow:0 4px 0 #361c08}
.sc{background:linear-gradient(180deg,#2f190a,#1b0d04);border-radius:13px;padding:3px 9px 4px;text-align:center;min-width:68px;border:2px solid var(--teamA);box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative}
.sc.th{border-color:var(--teamB)}
.sc-top{display:flex;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;opacity:.92}
.sc-dot{width:7px;height:7px;border-radius:50%;background:var(--teamA);display:inline-block}
.sc.th .sc-dot{background:var(--teamB)}
.sc-you{background:var(--gold);color:#4a2500;border-radius:6px;padding:0 4px;font-size:9px;font-weight:700}
.sc-val{display:flex;align-items:baseline;justify-content:center;gap:2px}
.sc b{font:400 24px/1 "Lilita One",sans-serif;color:var(--gold)}
.sc span.of10{font-size:11px;opacity:.65}
.sc-bar{width:100%;height:4px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:2px}
.sc-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4aa3ff,#8be0ff);border-radius:99px;transition:width .35s cubic-bezier(.22,1,.36,1)}
.sc.th .sc-bar i{background:linear-gradient(90deg,#ff6b6b,#ffb09c)}
#mid{flex:1;text-align:center;line-height:1.15;min-width:0}
#trump{font:400 20px "Lilita One","Noto Sans Sinhala","Noto Sans Tamil",sans-serif;display:flex;align-items:center;justify-content:center;gap:4px}
#trump i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;background:#fff;border-radius:9px;padding:0 7px;min-width:28px;height:26px;font-size:22px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#tcount{font-size:12px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-acts{display:flex;align-items:center;gap:5px;flex:none}
/* players & glowing turn avatars */
.op{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.op.p2{top:calc(env(safe-area-inset-top,0px) + 74px);left:50%;transform:translateX(-50%)}
.op.p1{left:6px;top:27%}.op.p3{right:6px;top:27%}
.op.p0{left:10px;bottom:calc(var(--hw)*1.4 + 22px);flex-direction:row}
.pb{display:flex;align-items:center;gap:6px;background:rgba(4,20,13,.62);border-radius:30px;padding:3px 11px 3px 3px;font-size:13px;border:2px solid rgba(255,255,255,.14);backdrop-filter:blur(2px);transition:border-color .25s,box-shadow .25s,transform .25s}
.pb .av{width:34px;height:34px;border-radius:50%;background:#fff7e0;display:flex;align-items:center;justify-content:center;font-size:19px;border:3px solid var(--teamA);transition:box-shadow .25s,transform .25s}
.pb.them .av{border-color:var(--teamB)}
.pb.act{border-color:var(--gold);background:rgba(38,24,4,.82);box-shadow:0 0 18px rgba(255,200,60,.85);animation:pl 1.1s ease-in-out infinite alternate}
.pb.act .av{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(255,210,70,.95);animation:avPulse 1.1s ease-in-out infinite alternate}
@keyframes pl{to{box-shadow:0 0 8px rgba(255,200,60,.45)}}
@keyframes avPulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.pb em{font-style:normal;background:var(--gold);color:#5a3200;border-radius:50%;width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pb .n{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh{display:flex;align-items:center}
.oh .card{width:30px;margin-left:-19px;box-shadow:0 1px 3px rgba(0,0,0,.5);transition:transform .2s}.oh .card:first-child{margin-left:0}
.oh.v{flex-direction:column}.oh.v .card{margin-left:0;margin-top:-34px}.oh.v .card:first-child{margin-top:0}
/* floating avatar chat bubbles */
.cbub{position:absolute;max-width:min(44vw,190px);background:rgba(255,252,240,.96);color:#1d1607;padding:6px 11px;border-radius:14px;font-size:13px;line-height:1.25;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.38);border:2px solid var(--teamA);pointer-events:none;z-index:12;white-space:normal;word-break:break-word;animation:bubIn .25s cubic-bezier(.22,1,.36,1)}
.cbub.them{border-color:var(--teamB)}
.cbub.out{opacity:0;transform:translateY(-6px) scale(.95);transition:opacity .3s,transform .3s}
.op.p0 .cbub{bottom:calc(100% + 8px);left:0}
.op.p1 .cbub{bottom:calc(100% + 6px);left:0}
.op.p3 .cbub{bottom:calc(100% + 6px);right:0}
.op.p2 .cbub{top:42px;left:50%;transform:translateX(-50%);text-align:center}
.op.p2 .cbub.out{transform:translateX(-50%) translateY(-6px) scale(.95)}
@keyframes bubIn{from{opacity:0;transform:translateY(6px) scale(.86)}}
.op.p2 .cbub{animation:bubIn2 .25s cubic-bezier(.22,1,.36,1)}
@keyframes bubIn2{from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.86)}}
/* tricks & smooth card animations */
#tricks{position:absolute;left:50%;top:47%;width:min(64vw,350px);height:min(50vw,290px);transform:translate(-50%,-50%);z-index:2}
.tk{position:absolute;width:var(--tw);transform:translate(-50%,-50%) rotate(var(--r));transition:box-shadow .25s}
.tk.p0{left:50%;top:68%}.tk.p1{left:20%;top:46%}.tk.p2{left:50%;top:24%}.tk.p3{left:80%;top:46%}
.tk.p0{--fx:0px;--fy:36vh}.tk.p1{--fx:-36vw;--fy:0px}.tk.p2{--fx:0px;--fy:-26vh}.tk.p3{--fx:36vw;--fy:0px}
.tk.new{animation:drop .42s cubic-bezier(.22,1,.36,1)}
@keyframes drop{from{transform:translate(calc(-50% + var(--fx)),calc(-50% + var(--fy))) rotate(calc(var(--r)*-2)) scale(1.25);opacity:.25}}
.tk.win{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(255,210,60,.95);animation:winPop .45s ease-out}
@keyframes winPop{40%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.09)}}
#tricks[data-sw="0"]{--sx:0px;--sy:44vh}#tricks[data-sw="1"]{--sx:-48vw;--sy:0px}#tricks[data-sw="2"]{--sx:0px;--sy:-36vh}#tricks[data-sw="3"]{--sx:48vw;--sy:0px}
#tricks[data-sw] .tk{animation:sw .55s .85s cubic-bezier(.4,0,.2,1) forwards}
@keyframes sw{to{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(var(--r)) scale(.45);opacity:0}}
#hand{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;z-index:4;pointer-events:none}
#hand .card{pointer-events:auto;width:var(--hw);margin-left:calc(var(--hw)*-.46);transform:translateY(var(--ty)) rotate(var(--rot));transition:transform .18s cubic-bezier(.22,1,.36,1),filter .2s,box-shadow .18s;cursor:pointer}
#hand .card:first-child{margin-left:0}
#hand .card.ok{box-shadow:0 0 0 2.5px #7dff8a,0 4px 12px rgba(0,0,0,.5)}
#hand .card.ok:hover,#hand .card.ok:active{transform:translateY(calc(var(--ty) - 20px)) rotate(var(--rot)) scale(1.04);box-shadow:0 0 0 3px #a8ffb0,0 10px 20px rgba(0,0,0,.55)}
#hand .card.mine{box-shadow:0 0 0 2px rgba(255,215,100,.6),0 2px 5px rgba(0,0,0,.45)}
#hand .card.ok.mine{box-shadow:0 0 0 2.5px #7dff8a,0 4px 12px rgba(0,0,0,.5)}
#hand .card.dim{filter:brightness(.55);cursor:not-allowed}
.deal{animation:deal .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes deal{from{transform:translate(0,-55vh) rotate(140deg) scale(.42);opacity:0}}
#st{position:absolute;left:0;right:0;top:calc(47% + min(30vw,175px));text-align:center;font-size:17px;color:var(--gold);text-shadow:0 2px 4px #000;z-index:3;pointer-events:none}
/* contextual commentary banner */
#banner{position:absolute;left:50%;bottom:calc(var(--hw)*1.4 + 62px);transform:translateX(-50%) translateY(8px);z-index:7;pointer-events:none;display:none;max-width:min(90vw,390px);width:max-content;background:rgba(10,28,18,.92);border:2px solid var(--gold);border-radius:16px;padding:7px 14px;box-shadow:0 8px 24px rgba(0,0,0,.5);backdrop-filter:blur(6px);align-items:center;gap:9px;opacity:0}
#banner.on{display:flex;animation:banIn .32s cubic-bezier(.22,1,.36,1) forwards}
#banner.good{border-color:#5ef078;background:rgba(10,42,24,.94)}
#banner.warn{border-color:#ff7b7b;background:rgba(48,14,18,.94)}
#banner.gold{border-color:#ffd23d;background:linear-gradient(135deg,rgba(62,38,4,.96),rgba(32,18,2,.96))}
#banner.info{border-color:#5ec4ff;background:rgba(10,30,48,.94)}
#banner .bi{font-size:22px;line-height:1;flex:none}
#banner .bt{display:flex;flex-direction:column;line-height:1.18}
#banner .bt b{font-size:14px;color:var(--gold)}
#banner.good .bt b{color:#8effa2}
#banner.warn .bt b{color:#ff9c9c}
#banner.info .bt b{color:#8cd6ff}
#banner .bt span{font-size:12.5px;color:#f5f5f5}
@keyframes banIn{from{opacity:0;transform:translateX(-50%) translateY(10px) scale(.94)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
/* pick & game over */
#pick,#over{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:6;display:none;text-align:center;width:min(92vw,420px)}
#pick.on,#over.on{display:block}
#pick .panel{padding:14px;gap:10px}
.sb{width:64px;height:64px;border-radius:16px;border:0;background:#fff;font-size:42px;cursor:pointer;box-shadow:0 4px 0 #aaa;transition:transform .1s}.sb:active{transform:translateY(3px)}
.sb.r{color:#d4202c;background:#fff}.sb.k{color:#16161a}
#over .panel{max-width:340px;gap:10px;margin:auto}
#over h2{font:400 32px "Lilita One","Noto Sans Sinhala","Noto Sans Tamil",sans-serif;color:var(--gold)}
/* reactions & quick Singlish banter popover */
.rx{display:none;position:absolute;right:8px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:19;gap:6px;background:rgba(12,24,18,.95);border:2px solid rgba(255,200,80,.45);padding:10px;border-radius:18px;flex-direction:column;width:min(88vw,290px);box-shadow:0 12px 30px rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.rx.on{display:flex}
.rx-em{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.rx-em button{font-size:24px;background:rgba(255,255,255,.08);border:0;border-radius:10px;width:42px;height:38px;cursor:pointer;color:#fff;transition:transform .12s,background .12s}
.rx-em button:hover{background:rgba(255,255,255,.18)}
.rx-em button:active{transform:scale(1.25)}
.rx-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);opacity:.9;text-align:center}
.rx-qt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qchip{font:inherit;font-size:12.5px;font-weight:700;color:#fff7dc;background:linear-gradient(180deg,rgba(255,200,60,.22),rgba(255,140,0,.16));border:1.5px solid rgba(255,200,60,.45);border-radius:12px;padding:7px 8px;cursor:pointer;text-align:center;line-height:1.15;transition:transform .1s,background .15s}
.qchip:hover{background:linear-gradient(180deg,rgba(255,200,60,.36),rgba(255,140,0,.28))}
.qchip:active{transform:scale(.96)}
.flyx{position:fixed;font-size:40px;z-index:30;pointer-events:none;animation:up 2.2s ease-out forwards}
@keyframes up{to{transform:translateY(-110px) scale(1.35);opacity:0}}
/* lobby team management */
#teamsGrid{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team-box{background:rgba(0,0,0,.28);border:2px solid rgba(74,163,255,.45);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:7px}
.team-box.tb{border-color:rgba(255,107,107,.45)}
.team-hd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 2px}
.tbadge{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:99px;text-transform:uppercase;color:#fff}
.tbadge.a{background:linear-gradient(135deg,#3593ff,#145fc4);box-shadow:0 2px 6px rgba(20,95,196,.4)}
.tbadge.b{background:linear-gradient(135deg,#ff6767,#c92434);box-shadow:0 2px 6px rgba(201,36,52,.4)}
.team-sub{font-size:11px;opacity:.78}
.seat{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:13px;padding:6px 8px;width:100%;transition:border-color .15s,background .15s}
.seat.picking{border-color:var(--gold);background:rgba(255,200,60,.16)}
.seat.target{border-color:#7dff8a;border-style:dashed;cursor:pointer}
.seat .av{width:34px;height:34px;border-radius:50%;background:#fff7e0;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;border:2px solid var(--teamA)}
.team-box.tb .seat .av{border-color:var(--teamB)}
.seat-info{flex:1;min-width:0;display:flex;flex-direction:column}
.seat-info b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-info small{font-size:11px;opacity:.8}
.seat-acts{display:flex;gap:4px;flex:none}
.sbtn{font:inherit;font-size:11px;font-weight:700;border:0;border-radius:9px;padding:5px 7px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff;transition:background .15s,transform .1s}
.sbtn:hover{background:rgba(255,255,255,.28)}
.sbtn:active{transform:scale(.95)}
.sbtn.mv{background:rgba(255,200,60,.25);color:#ffe79e}
.sbtn.mv:hover{background:rgba(255,200,60,.4)}
#lobChatRow{width:100%;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,200,80,.3);border-radius:14px;padding:7px 10px;cursor:pointer;transition:background .15s}
#lobChatRow:hover{background:rgba(0,0,0,.44)}
#lobChatPreview{flex:1;font-size:13px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
/* live text chat drawer */
#chatBox{position:fixed;right:14px;top:max(58px,calc(env(safe-area-inset-top) + 56px));width:min(94vw,380px);max-height:min(54vh,420px);z-index:25;display:none;flex-direction:column;background:rgba(6,24,16,.94);border:2px solid rgba(255,200,80,.45);border-radius:20px;box-shadow:0 16px 40px rgba(0,0,0,.6);backdrop-filter:blur(8px);overflow:hidden}
#chatBox.on{display:flex}
.chat-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;background:linear-gradient(#8e5422,#58300e);border-bottom:1px solid rgba(255,200,80,.25)}
.chat-hd b{flex:1;font-size:15px}
.chat-x{width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chat-x:hover{background:rgba(255,255,255,.3)}
#chatMsgs{flex:1;min-height:110px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
.cempty{margin:auto;text-align:center;font-size:13px;opacity:.7;padding:16px 8px}
.cm{display:flex;flex-direction:column;max-width:86%;align-self:flex-start}
.cm.me{align-self:flex-end;align-items:flex-end}
.cm.sys{align-self:center;max-width:94%;font-size:11.5px;color:#ffe49a;background:rgba(255,200,60,.14);border-radius:99px;padding:3px 10px}
.cm-meta{font-size:11px;opacity:.82;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.cm-dot{width:7px;height:7px;border-radius:50%;background:var(--teamA)}
.cm.tb .cm-dot{background:var(--teamB)}
.cm-bub{background:rgba(255,255,255,.13);color:#fff;padding:6px 10px;border-radius:13px 13px 13px 4px;font-size:13.5px;line-height:1.3;word-break:break-word}
.cm.me .cm-bub{background:linear-gradient(135deg,#258a4f,#176437);border:1px solid rgba(125,255,138,.35);border-radius:13px 13px 4px 13px}
.cm.quick .cm-bub{border:1px solid rgba(255,200,60,.5);color:#fff4c2}
#chatQuick{display:flex;gap:5px;padding:6px 8px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.22);scrollbar-width:none}
#chatQuick::-webkit-scrollbar{display:none}
#chatQuick .qchip{flex:none;padding:5px 9px;font-size:12px;border-radius:99px}
#chatForm{display:flex;gap:6px;padding:8px;background:rgba(0,0,0,.3);border-top:1px solid rgba(255,255,255,.1)}
#chatIn{flex:1;min-width:0;font:inherit;font-size:14px;color:#221600;background:#f7ebd0;border:0;border-radius:12px;padding:7px 10px}
#chatIn::placeholder{color:#7a6a45}
#chatSend{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:12px;padding:7px 13px;background:linear-gradient(#ffd23d,#ff9100);color:#522500;cursor:pointer}
.code{font:400 44px "Lilita One",sans-serif;letter-spacing:.12em;background:#0a3a22;border:3px solid #d9a24a;border-radius:14px;padding:4px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rules{text-align:left;font-size:15px;line-height:1.5}.rules li{margin-left:18px;margin-bottom:6px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#fff;color:#14522f;padding:10px 20px;border-radius:30px;font-weight:700;z-index:40;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4);text-align:center;max-width:92vw}
/* responsive adjustments */
@media (max-width:520px){
 #teamsGrid{grid-template-columns:1fr}
 #hud{gap:4px;padding:max(6px,env(safe-area-inset-top)) 5px 6px}
 .sc{min-width:54px;padding:2px 6px 3px}
 .sc b{font-size:20px}
 .sc-top{font-size:9px}
 #trump{font-size:16px}
 #trump i{min-width:22px;height:22px;font-size:17px;padding:0 5px}
 #tcount{font-size:11px}
 .ib{width:34px;height:34px;font-size:16px}
 .hud-acts{gap:4px}
}
@media (max-width:979px){
 #chatBox{left:50%;right:auto;transform:translateX(-50%)}
}
@media (min-width:980px){
 #chatBox{top:16px;bottom:16px;right:16px;width:305px;max-height:none}
 body.chat-open .scr{left:calc(50% - 160px)}
}
@media (min-width:1320px){
 body.chat-open .scr{left:50%}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}

/* Royal lobby polish + match result presentation */
#teamsGrid{align-items:stretch}.team-box{min-width:0;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.team-box .seat{min-height:58px}.team-box .seat .seat-info{overflow:hidden}
.team-box .seat-acts .sbtn{white-space:nowrap}#lobChatRow{min-height:48px}
#chatBox{height:min(58vh,480px)}#chatMsgs{scroll-behavior:smooth}.cm-bub{overflow-wrap:anywhere}
.match-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin:4px 0}
.match-stat{border-radius:14px;padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.match-stat.a{border-color:rgba(74,163,255,.7)}.match-stat.b{border-color:rgba(255,107,107,.7)}
.match-stat b{display:block;font:400 25px "Lilita One",sans-serif;color:var(--gold)}
.match-stat small{font-size:11px;opacity:.8}.result-line{font-size:14px;line-height:1.35;color:#fff4cf}
#over .panel{box-shadow:0 16px 40px rgba(0,0,0,.42)}
@media(max-width:520px){.team-box{padding:7px}.team-box .seat{padding:6px}.team-box .seat-acts .sbtn{font-size:10px;padding:5px}}

</style>

      <circle cx="27" cy="50" r="4" fill="#3fa4ff" stroke="#3a1600" stroke-width="2"/>
      <circle cx="73" cy="50" r="4" fill="#3fa4ff" stroke="#3a1600" stroke-width="2"/>

      <circle cx="97" cy="16" r="3.5" fill="#fff" stroke="#3a1600" stroke-width="2"/>

    <input class="inp" id="nm2" maxlength="12" data-ph="name">

    <div style="opacity:.85;text-align:center" data-i="or"></div>
    <input class="inp" id="cd" inputmode="numeric" maxlength="6" data-ph="code" style="font-size:28px;letter-spacing:.15em">
    <button class="btn b" id="jn" data-i="join"></button>
  </div>
  <div class="panel" id="rLob" style="display:none">

      <span class="badge" id="lobChatBadge" style="position:static"></span>

    <div id="wt" style="display:none" data-i="waiting"></div>

  <div class="credit"></div>
</section>

    <button class="ib bk" aria-label="Leave">↩</button>

      <div class="sc-top"><span class="sc-dot"></span><span id="scULbl">TEAM A</span><span class="sc-you" data-i="you"></span></div>

      <div class="sc-bar"><i id="sUBar"></i></div>

      <div class="sc-bar"><i id="sTBar"></i></div>

  <div id="over"><div class="panel"><h2 id="oT"></h2><div id="oS"></div><div class="row" id="oB"></div></div></div>
  <div id="hand"></div>
</section>

function actPlay(seat,card){if(!H||H.phase!=='play'||H.turn!==seat||!card)return;const h=H.hands[seat],k=h.findIndex(c=>c.s===card.s&&c.r===card.r);if(k<0||!canPlay(h,H.trick,h[k]))return;
 H.trick.push({seat,card:h.splice(k,1)[0]});
 if(H.trick.length<4){H.turn=(seat+1)%4;push();aiStep();return}
 let w=H.trick[0];for(const x of H.trick.slice(1))if(better(x.card,w.card,H.trump))w=x;
 H.phase='trickEnd';H.tw=w.seat;H.tricks[w.seat%2]++;push();
 if(!humans[w.seat]&&Math.random()<.25)bcastRx(w.seat,['😎','😏','🔥','👏'][Math.floor(Math.random()*4)]);
 const tk=++H.tok;setTimeout(()=>{if(!H||tk!==H.tok)return;H.trick=[];
  if(H.hands.every(x=>!x.length))return handEnd();
  H.phase='play';H.turn=w.seat;push();aiStep()},1500)}
function handEnd(){const[t0,t1]=H.tricks;let res={t:[t0,t1]};
 if(t0===t1){H.carry++;res.tie=true;res.carry=H.carry}else{const team=t0>t1?0:1,pts=(Math.max(t0,t1)===8?2:1)+H.carry;H.carry=0;H.score[team]+=pts;res.team=team;res.pts=pts;res.kap=Math.max(t0,t1)===8}
 H.res=res;H.phase='handEnd';push();const tk=++H.tok;
 setTimeout(()=>{if(!H||tk!==H.tok)return;afterHand()},3600)}
function afterHand(){if(H.score[0]>=10||H.score[1]>=10){H.phase='gameEnd';push()}else{H.dealer=(H.dealer+1)%4;newHand()}}
function botTrump(s){const sc={S:0,H:0,D:0,C:0};H.hands[s].forEach(c=>sc[c.s]+=c.r-5+3);return SU.reduce((a,b)=>sc[b]>sc[a]?b:a)}
function botPlay(seat){const h=H.hands[seat],tr=H.trick,Tr=H.trump,ls=tr.length?tr[0].card.s:null;
 const Lc=ls&&h.some(c=>c.s===ls)?h.filter(c=>c.s===ls):h.slice(),val=c=>c.r+(c.s===Tr?20:0),low=a=>a.reduce((x,c)=>val(c)<val(x)?c:x);
 if(!tr.length){const nt=Lc.filter(c=>c.s!==Tr),ac=nt.find(c=>c.r===14);if(ac)return ac;if(nt.length)return low(nt);return Lc.reduce((a,c)=>c.r>a.r?c:a)}
 let w=tr[0];for(const x of tr)if(better(x.card,w.card,Tr))w=x;
 if((w.seat+2)%4===seat)return low(Lc);const win=Lc.filter(c=>better(c,w.card,Tr));return win.length?low(win):low(Lc)}
function aiStep(){if(!H)return;if(H.phase!=='trump'&&H.phase!=='play')return;const tk=++H.tok,s=H.turn;if(humans[s])return;
 setTimeout(()=>{if(!H||tk!==H.tok)return;H.phase==='trump'?actTrump(s,botTrump(s)):actPlay(s,botPlay(s))},H.phase==='trump'?1300:700+Math.random()*500)}
const view=seat=>({ver:H.ver|0,phase:H.phase,dealer:H.dealer,turn:H.turn,trump:H.trump,hand:H.hands[seat],counts:H.hands.map(h=>h.length),trick:H.trick,tw:H.tw,tricks:H.tricks,score:H.score,carry:H.carry,names,res:H.res,seat,host:mode!=='guest'});
function push(){H.ver=(H.ver|0)+1;for(const s in hostConns)tx(+s,{t:'st',v:view(+s)});render(view(0));saveHost()}
function bcastRx(seat,e){for(const s in hostConns)tx(+s,{t:'rx',seat,e});fly(seat,e)}

const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
const noNet=()=>typeof mqtt==='undefined'&&(toast(T('nonet')),true);

const pub=(t,o)=>{try{if(mq&&mq.connected)mq.publish(t,JSON.stringify(o),{qos:0})}catch(e){}};
const tx=(s,o)=>{if(hostConns[s]&&pids[s])pub(tDn(pids[s]),o)};
function netClose(){clearInterval(hbT);hbT=null;const c=mq;mq=null;try{c&&c.end()}catch(e){}}
function netBye(){try{if(mode==='host'){for(const s in hostConns)tx(+s,{t:'bye'})}else if(mode==='guest')pub(tUp(),{t:'bye',pid:PID})}catch(e){}}
function netStart(idx,sub,onMsg,onUp,onFail){
 netClose();const g=++gen;let ok=false,c;
 try{c=mqtt.connect(BROKERS[idx],{clientId:'omi_'+Math.random().toString(36).slice(2,10),clean:true,reconnectPeriod:2000,connectTimeout:8000,keepalive:20})}catch(e){setTimeout(()=>{if(g===gen)onFail()},0);return g}
 mq=c;
 const to=setTimeout(()=>{if(!ok&&g===gen)onFail()},11000);
 c.on('connect',()=>{if(g!==gen)return;c.subscribe(sub,{qos:0},err=>{if(g!==gen)return;if(err){if(!ok)onFail();return}const first=!ok;ok=true;clearTimeout(to);onUp(first)})});
 c.on('message',(t,p)=>{if(g!==gen)return;let m;try{m=JSON.parse(p.toString())}catch(e){return}onMsg(m)});
 c.on('error',()=>{});
 return g}

function hostBoot(i,onFail){
 netStart(i,tUp(),hostData,first=>{if(!first)return;beat();
  if(H){
   if(H.phase==='trickEnd'){H.trick=[];H.phase='play';H.turn=H.tw;if(H.hands.every(x=>!x.length)){handEnd();return}}
   if(H.phase==='handEnd'){afterHand();return}
   push();aiStep()}
  else lobPush()},()=>{netClose();onFail()})}

 names=s.names;humans=[true,false,false,false];pids=s.pids||{};started=!!s.started;H=s.H||null;myName=names[0]||nameOf();
 if(H){H.names=names;H.humans=humans}
 roomCode=s.code;toast(T('connecting'));hostBoot(+s.code.slice(-1),()=>{toast(T('connprob'));home()})}
function beat(){clearInterval(hbT);let ls=Date.now();hbT=setInterval(()=>{const n=Date.now();if(n-ls>9000)for(const s in hostConns)hostConns[s].last=n;ls=n;for(const s in hostConns)if(n-hostConns[s].last>16000)dropped(+s)},4000)}
function sendState(s){H?tx(s,{t:'st',v:view(s)}):tx(s,{t:'lob',names,humans,seat:s})}
function hostData(m){if(mode!=='host'||!m||!m.pid)return;const pid=String(m.pid).slice(0,40),now=Date.now();
 const sc=[1,2,3].find(x=>pids[x]===pid&&hostConns[x]);
 if(m.t==='hi'){let s=[1,2,3].find(x=>pids[x]===pid);if(!s&&!started)s=[1,2,3].find(x=>!humans[x]);
  if(!s){pub(tDn(pid),{t:'full'});return}
  const fresh=!hostConns[s];hostConns[s]={last:now};humans[s]=true;pids[s]=pid;
  if(fresh)names[s]=String(m.name||'Player').slice(0,12);
  if(!fresh){sendState(s);return}
  toast(T('joined',names[s]));if(H){push();aiStep()}else lobPush()}
 else if(!sc)pub(tDn(pid),{t:'unk'});
 else if(m.t==='ping'){hostConns[sc].last=now;pub(tDn(pid),{t:'pong',ver:H?H.ver|0:-1})}
 else if(m.t==='sync')sendState(sc);
 else if(m.t==='act'){hostConns[sc].last=now;m.a==='trump'?actTrump(sc,m.v):actPlay(sc,m.v)}
 else if(m.t==='rx'){if(typeof m.e==='string')bcastRx(sc,m.e.slice(0,3))}
 else if(m.t==='chat'&&typeof m.text==='string'){
  const msg={t:'chat',pid,name:String(m.name||names[sc]||'Player').slice(0,16),text:String(m.text).slice(0,120),team:sc%2,quick:!!m.quick};
  receiveChat(msg);for(const x in hostConns)tx(+x,msg);
 }
 else if(m.t==='team'&&!started){switchLobbyTeam(sc)}
 else if(m.t==='bye')dropped(sc)}
function dropped(s){if(!hostConns[s])return;delete hostConns[s];humans[s]=false;toast(T('left',names[s]));
 if(!started){delete pids[s];names[s]=BOTN[s]}
 if(H){push();aiStep()}else lobPush()}
$('#start').onclick=()=>{started=true;keepAwake();newGame()};
$('#cpC').onclick=()=>copy(roomCode);
$('#cpL').onclick=()=>{const u=location.href.split('#')[0].split('?')[0]+'?room='+roomCode;if(navigator.share)navigator.share({title:'OMI Royal',text:T('sharetxt')+' ('+roomCode+')',url:u}).catch(()=>{});else copy(u)};

/* guest */
let gTry=0,okFlag=false,gotAny=false,lastRx=0,gVer=-2;
function gOk(code){okFlag=true;gTry=0;try{localStorage.setItem('omiGuest',JSON.stringify({code,t:Date.now()}))}catch(e){}}
function gLost(){if(mode!=='guest')return;if(++gTry>12){toast(T('hostleft'));home();return}toast(T('reconn'));setTimeout(()=>{if(mode==='guest')gStart(roomCode)},2500)}
function hello(){clearInterval(hbT);const g=gen;let n=0;gotAny=false;lastRx=Date.now();
 const hi=()=>pub(tUp(),{t:'hi',pid:PID,name:myName});
 hi();
 hbT=setInterval(()=>{if(g!==gen||mode!=='guest')return;
  if(!gotAny){if(++n>3){clearInterval(hbT);if(!okFlag){toast(T('notfound'));cleanup();clearSaved();show('room')}else gLost();return}hi();return}
  pub(tUp(),{t:'ping',pid:PID});
  const d=Date.now()-lastRx;
  if(d>60000){clearInterval(hbT);toast(T('hostleft'));home()}else if(d>12000)toast(T('reconn'))},3000)}
function gStart(code){roomCode=code;const i=+code.slice(-1);gVer=-2;
 if(!(i>=0&&i<BROKERS.length)){toast(T('notfound'));cleanup();clearSaved();show('room');return}
 netStart(i,tDn(PID),gData,()=>{if(mode==='guest')hello()},()=>{netClose();if(!okFlag){toast(T('connprob'));cleanup();show('room')}else gLost()})}
function gData(m){if(mode!=='guest'||!m)return;gotAny=true;lastRx=Date.now();
 if(m.t==='lob'){gOk(roomCode);lobby(m)}
 else if(m.t==='st'){gOk(roomCode);gVer=m.v.ver;render(m.v)}
 else if(m.t==='rx')fly(m.seat,m.e);
  else if(m.t==='chat')receiveChat(m);
 else if(m.t==='pong'){if(m.ver>=0&&m.ver!==gVer)pub(tUp(),{t:'sync',pid:PID})}
 else if(m.t==='unk')pub(tUp(),{t:'hi',pid:PID,name:myName});
 else if(m.t==='full'){toast(T('full'));cleanup();clearSaved();show('room')}
 else if(m.t==='bye'){toast(T('hostleft'));home()}}
$('#jn').onclick=()=>{if(noNet())return;const c=$('#cd').value.trim();if(!/^\d{6}$/.test(c))return toast(T('enter'));
 cleanup();myName=nameOf();mode='guest';roomCode=c;gTry=0;okFlag=false;toast(T('connecting'));keepAwake();gStart(c)};

/* coming back from WhatsApp / another app: reconnect */
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;
 try{if(mq&&!mq.connected&&!mq.reconnecting)mq.reconnect()}catch(e){}
 if(mode!=='off')keepAwake();
 if(mode==='guest'&&okFlag)pub(tUp(),{t:'ping',pid:PID})});

const q=new URLSearchParams(location.search).get('room');
applyLang();
if(q&&/^\d{6}$/.test(q)){show('room');$('#cd').value=q;setTimeout(()=>{try{$('#nm2').focus()}catch(e){}},300)}
})();
</script>
